name: Automated GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Comprehensive 24-Test Suite
        run: |
          python tests/test_full_suite.py

      - name: Build Standalone Windows Executable (.exe)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name="AutoClicker" --icon=assets/icon.ico --collect-all customtkinter main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoClicker.exe
          name: Auto Clicker Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
