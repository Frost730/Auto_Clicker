name: Build & Test Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Comprehensive 24-Test Suite
        run: |
          python tests/test_full_suite.py

      - name: Build Standalone Windows Executable (.exe)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name="AutoClicker" --icon=assets/icon.ico --collect-all customtkinter main.py

      - name: Upload AutoClicker.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows-Exe
          path: dist/AutoClicker.exe
          if-no-files-found: error
